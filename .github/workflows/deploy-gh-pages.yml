name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.8

      - run: flutter pub get

      # Project pages (<owner>.github.io/<repo>/) are served from a
      # subpath, so the app's asset/base URLs must include the repo name --
      # web/index.html's <base href="$FLUTTER_BASE_HREF"> is what this flag
      # substitutes.
      #
      # SUPABASE_URL/SUPABASE_PUBLISHABLE_KEY are injected as compile-time
      # constants (read via String.fromEnvironment in supabase_config.dart)
      # from the repo's Actions secrets, so rotating the anon key only
      # means updating the secret, not editing/committing code.
      - run: >
          flutter build web --release
          --base-href "/${{ github.event.repository.name }}/"
          --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          --dart-define=SUPABASE_PUBLISHABLE_KEY=${{ secrets.SUPABASE_PUBLISHABLE_KEY }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
